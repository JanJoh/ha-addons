name: Spoolman
slug: spoolman
version: "0.27.1"
description: Keep track of your 3D printer filament spools
url: https://github.com/JanJoh/ha-addons/tree/main/spoolman
# 64-bit targets only; armhf/armv7 are deprecated in current Home Assistant.
arch:
  - aarch64
  - amd64
# The upstream image is Debian without an s6 supervisor; run.sh is the entrypoint.
init: false
# Ingress: the Spoolman web UI opens in the Home Assistant sidebar.
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d-nozzle
panel_title: Spoolman
# Port for clients that talk to Spoolman's API directly: the Spoolman integration
# in Home Assistant, Moonraker/Klipper, OctoPrint, label printers. Reachable from
# Home Assistant itself via the add-on's hostname even when not mapped on the host.
ports:
  7912/tcp: null
ports_description:
  7912/tcp: Web UI and API (direct access; optional, the sidebar uses ingress)
# Pre-built wrapper image (upstream Spoolman image + nginx + bashio + run.sh).
image: ghcr.io/janjoh/spoolman-addon
# The database and Spoolman's own nightly backups live in /data, which Home
# Assistant includes in its backups.
backup: hot
options:
  automatic_backup: true
schema:
  automatic_backup: bool
  log_level: list(debug|info|warning|error)?
