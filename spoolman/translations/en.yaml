configuration:
  automatic_backup:
    name: Nightly database copy
    description: >-
      Spoolman's own nightly copy of its database, keeping the last 5, in the
      add-on's data folder. Home Assistant backups include the database either way.
  log_level:
    name: Log level
    description: >-
      How much Spoolman writes to the add-on log. Leave unset for Spoolman's
      default (info).
network:
  7912/tcp: >-
    Web UI and API for direct access (Moonraker, OctoPrint, other machines).
    Not needed for the sidebar or the Spoolman integration in Home Assistant.
